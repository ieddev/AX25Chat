<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Opstelling thuis: basisstation, PC met AX25Chat en telefoon via het thuis-wifi</title>
  <desc>Een basisstation (bijvoorbeeld een Icom IC-7300 of IC-9700) is met een USB-kabel verbonden met een PC met Linux of Windows waarop AX25Chat draait. De PC hangt aan de router van het thuisnetwerk. De telefoon met de AX25Chat-app verbindt via het thuis-wifi met de PC, op het adres dat op Status, Telefoon en app staat, bijvoorbeeld 192.168.1.50:8080.</desc>

  <!-- achtergrond -->
  <rect x="0" y="0" width="1200" height="470" rx="22" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="22" fill="none" stroke="#d8dee4"/>

  <!-- ===== kabels (eerst, zodat ze achter de apparaten lopen) ===== -->
  <!-- USB: set -> PC -->
  <path d="M296 250 C 336 250, 340 262, 392 262" fill="none" stroke="#2f6fb3" stroke-width="7" stroke-linecap="round"/>
  <!-- netwerk: PC -> router -->
  <path d="M520 330 C 560 372, 690 372, 740 300" fill="none" stroke="#2f6fb3" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== basisstation (IC-7300-achtig) ===== -->
  <g>
    <!-- voetjes -->
    <rect x="58" y="296" width="26" height="10" rx="3" fill="#2b3440"/>
    <rect x="252" y="296" width="26" height="10" rx="3" fill="#2b3440"/>
    <!-- behuizing -->
    <rect x="36" y="188" width="262" height="110" rx="10" fill="#4a5461" stroke="#2b3440" stroke-width="2"/>
    <!-- USB-aansluiting achter (rechts) -->
    <rect x="290" y="242" width="12" height="18" rx="3" fill="#2b3440"/>
    <!-- aan/uit + knopjes links -->
    <rect x="50" y="204" width="20" height="12" rx="3" fill="#6b7685"/>
    <circle cx="62" cy="244" r="11" fill="#2b3440"/><circle cx="62" cy="244" r="6" fill="#6b7685"/>
    <circle cx="62" cy="276" r="8" fill="#2b3440"/>
    <!-- display met spectrum -->
    <rect x="84" y="200" width="122" height="84" rx="6" fill="#1f2a36"/>
    <text x="145" y="222" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef5">14.102.5</text>
    <text x="145" y="237" font-size="10" text-anchor="middle" fill="#9fc3e8">USB-D  300</text>
    <path d="M92 276 L 102 272 L 110 274 L 118 266 L 124 270 L 132 258 L 138 268 L 146 262 L 154 271 L 162 267 L 170 273 L 180 269 L 190 274 L 198 272" fill="none" stroke="#7fd08a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="92" y1="278" x2="198" y2="278" stroke="#3a4a5c" stroke-width="1.5"/>
    <!-- grote afstemknop -->
    <circle cx="250" cy="238" r="32" fill="#2b3440"/>
    <circle cx="250" cy="238" r="24" fill="#6b7685"/>
    <circle cx="260" cy="228" r="4" fill="#2b3440"/>
    <!-- toetsenrij onder -->
    <g fill="#6b7685">
      <rect x="216" y="278" width="16" height="10" rx="2"/><rect x="238" y="278" width="16" height="10" rx="2"/><rect x="260" y="278" width="16" height="10" rx="2"/>
    </g>
    <!-- handmicrofoon -->
    <path d="M44 298 q 8 8 0 12 q -8 4 0 12 q 8 4 0 12 q -8 4 0 12" fill="none" stroke="#2b3440" stroke-width="3" stroke-linecap="round"/>
    <rect x="26" y="344" width="36" height="40" rx="12" fill="#2b3440"/>
    <g stroke="#6b7685" stroke-width="2" stroke-linecap="round"><line x1="36" y1="356" x2="52" y2="356"/><line x1="36" y1="362" x2="52" y2="362"/><line x1="36" y1="368" x2="52" y2="368"/></g>
  </g>

  <!-- ===== PC (beeldscherm) ===== -->
  <g>
    <!-- voet -->
    <rect x="488" y="322" width="24" height="28" fill="#3a4350"/>
    <rect x="452" y="346" width="96" height="10" rx="4" fill="#2b3440"/>
    <!-- USB-aansluiting links -->
    <rect x="388" y="254" width="12" height="16" rx="3" fill="#2b3440"/>
    <!-- netwerk-aansluiting onder -->
    <rect x="512" y="318" width="16" height="12" rx="2" fill="#2b3440"/>
    <!-- scherm -->
    <rect x="398" y="152" width="204" height="172" rx="10" fill="#2b3440"/>
    <rect x="408" y="162" width="184" height="148" rx="4" fill="#ffffff"/>
    <!-- vensterkop -->
    <rect x="408" y="162" width="184" height="22" rx="4" fill="#2f6fb3"/>
    <rect x="408" y="174" width="184" height="10" fill="#2f6fb3"/>
    <text x="500" y="178" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">AX25Chat</text>
    <!-- tabbladen -->
    <g fill="#e7ecf1"><rect x="414" y="190" width="38" height="10" rx="3"/><rect x="456" y="190" width="38" height="10" rx="3"/><rect x="498" y="190" width="38" height="10" rx="3"/><rect x="540" y="190" width="38" height="10" rx="3"/></g>
    <rect x="414" y="190" width="38" height="10" rx="3" fill="#cfe0f3"/>
    <!-- chatballonnen -->
    <rect x="416" y="208" width="96" height="20" rx="8" fill="#e7ecf1"/>
    <rect x="488" y="234" width="96" height="20" rx="8" fill="#cfe0f3"/>
    <rect x="416" y="260" width="80" height="20" rx="8" fill="#e7ecf1"/>
    <!-- invoerregel -->
    <rect x="416" y="288" width="168" height="14" rx="7" fill="none" stroke="#aab4bf" stroke-width="1.5"/>
  </g>

  <!-- ===== router ===== -->
  <g>
    <!-- antennes -->
    <rect x="752" y="198" width="8" height="54" rx="4" fill="#3a4350" transform="rotate(-14 756 252)"/>
    <rect x="840" y="198" width="8" height="54" rx="4" fill="#3a4350" transform="rotate(14 844 252)"/>
    <rect x="736" y="248" width="128" height="52" rx="12" fill="#ffffff" stroke="#2b3440" stroke-width="2.5"/>
    <!-- lampjes -->
    <g fill="#3d9b57"><circle cx="760" cy="274" r="4"/><circle cx="776" cy="274" r="4"/><circle cx="792" cy="274" r="4"/></g>
    <circle cx="808" cy="274" r="4" fill="#2f6fb3"/>
    <rect x="822" y="268" width="28" height="12" rx="3" fill="#e7ecf1"/>
  </g>

  <!-- ===== wifi ===== -->
  <g fill="none" stroke="#2f6fb3" stroke-width="6" stroke-linecap="round">
    <path d="M908 222 A 22 22 0 0 1 908 266"/>
    <path d="M922 206 A 42 42 0 0 1 922 282"/>
    <path d="M936 190 A 62 62 0 0 1 936 298"/>
  </g>
  <circle cx="892" cy="244" r="6" fill="#2f6fb3"/>

  <!-- ===== telefoon ===== -->
  <g>
    <rect x="1000" y="120" width="120" height="226" rx="18" fill="#2b3440"/>
    <rect x="1008" y="138" width="104" height="186" rx="6" fill="#ffffff"/>
    <rect x="1042" y="127" width="36" height="5" rx="2.5" fill="#6b7685"/>
    <!-- kopbalk -->
    <rect x="1008" y="138" width="104" height="22" rx="6" fill="#2f6fb3"/>
    <rect x="1008" y="150" width="104" height="10" fill="#2f6fb3"/>
    <text x="1060" y="154" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">AX25Chat</text>
    <!-- chatballonnen -->
    <rect x="1016" y="172" width="66" height="22" rx="8" fill="#e7ecf1"/>
    <rect x="1038" y="204" width="66" height="22" rx="8" fill="#cfe0f3"/>
    <rect x="1016" y="236" width="56" height="22" rx="8" fill="#e7ecf1"/>
    <rect x="1048" y="268" width="56" height="22" rx="8" fill="#cfe0f3"/>
    <!-- invoerregel -->
    <rect x="1016" y="300" width="88" height="16" rx="8" fill="none" stroke="#aab4bf" stroke-width="1.5"/>
  </g>

  <!-- ===== kabel-labels ===== -->
  <g font-size="15" fill="#2f6fb3" font-weight="600" text-anchor="middle">
    <text x="344" y="234">USB-kabel</text>
    <text x="344" y="286" font-size="13" font-weight="400" fill="#57606a">audio + CAT</text>
    <text x="636" y="318">netwerk</text>
    <text x="636" y="337" font-size="13" font-weight="400" fill="#57606a">kabel of wifi</text>
    <text x="930" y="160">wifi</text>
    <text x="930" y="330" font-size="13" font-weight="400" fill="#57606a">thuis-wifi</text>
  </g>

  <!-- ===== namen onder de apparaten ===== -->
  <g text-anchor="middle" fill="#24292f">
    <text x="167" y="412" font-size="19" font-weight="700">Basisstation</text>
    <text x="167" y="436" font-size="14" fill="#57606a">bijv. IC-7300 of IC-9700, of set + DigiRig</text>

    <text x="500" y="412" font-size="19" font-weight="700">PC</text>
    <text x="500" y="436" font-size="14" fill="#57606a">Linux of Windows · AX25Chat · Direwolf</text>

    <text x="800" y="412" font-size="19" font-weight="700">Router</text>
    <text x="800" y="436" font-size="14" fill="#57606a">je thuisnetwerk</text>

    <text x="1060" y="412" font-size="19" font-weight="700">Telefoon</text>
    <text x="1060" y="436" font-size="14" fill="#57606a">app op 192.168.1.50:8080</text>
  </g>
</svg>
