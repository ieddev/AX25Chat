<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Opstelling: portofoon, DigiRig, Raspberry Pi Zero en telefoon</title>
  <desc>Een Baofeng UV-5R is met een audio- en PTT-kabel verbonden met een DigiRig. De DigiRig zit met een USB-kabel aan een Raspberry Pi Zero met AX25Chat. De Pi maakt een wifi-hotspot waarmee de telefoon met de AX25Chat-app verbindt.</desc>

  <!-- achtergrond -->
  <rect x="0" y="0" width="1200" height="470" rx="22" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="22" fill="none" stroke="#d8dee4"/>

  <!-- ===== kabels (eerst, zodat ze achter de apparaten lopen) ===== -->
  <!-- audio + PTT: portofoon -> DigiRig -->
  <path d="M206 205 C 280 205, 290 238, 372 238" fill="none" stroke="#2f6fb3" stroke-width="7" stroke-linecap="round"/>
  <!-- USB: DigiRig -> Pi -->
  <path d="M500 238 C 590 238, 640 372, 702 300" fill="none" stroke="#2f6fb3" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== portofoon ===== -->
  <g>
    <!-- antenne -->
    <rect x="168" y="38" width="16" height="100" rx="8" fill="#3a4350"/>
    <!-- knoppen bovenop -->
    <rect x="108" y="112" width="20" height="22" rx="4" fill="#3a4350"/>
    <rect x="138" y="116" width="16" height="18" rx="4" fill="#3a4350"/>
    <!-- behuizing -->
    <rect x="94" y="130" width="112" height="216" rx="16" fill="#4a5461"/>
    <rect x="94" y="130" width="112" height="216" rx="16" fill="none" stroke="#2b3440" stroke-width="2"/>
    <!-- luidspreker -->
    <g stroke="#2b3440" stroke-width="3" stroke-linecap="round">
      <line x1="110" y1="150" x2="190" y2="150"/>
      <line x1="110" y1="160" x2="190" y2="160"/>
      <line x1="110" y1="170" x2="190" y2="170"/>
    </g>
    <!-- display -->
    <rect x="108" y="184" width="84" height="40" rx="5" fill="#b9d7a8"/>
    <text x="150" y="210" font-size="15" font-weight="600" text-anchor="middle" fill="#2b3a24">144.900</text>
    <!-- toetsenbord -->
    <g fill="#6b7685">
      <rect x="110" y="236" width="22" height="16" rx="4"/><rect x="139" y="236" width="22" height="16" rx="4"/><rect x="168" y="236" width="22" height="16" rx="4"/>
      <rect x="110" y="258" width="22" height="16" rx="4"/><rect x="139" y="258" width="22" height="16" rx="4"/><rect x="168" y="258" width="22" height="16" rx="4"/>
      <rect x="110" y="280" width="22" height="16" rx="4"/><rect x="139" y="280" width="22" height="16" rx="4"/><rect x="168" y="280" width="22" height="16" rx="4"/>
      <rect x="110" y="302" width="22" height="16" rx="4"/><rect x="139" y="302" width="22" height="16" rx="4"/><rect x="168" y="302" width="22" height="16" rx="4"/>
    </g>
    <!-- PTT-knop aan de zijkant -->
    <rect x="86" y="190" width="9" height="46" rx="3" fill="#2b3440"/>
    <!-- stekker in de zijkant -->
    <rect x="200" y="196" width="14" height="18" rx="3" fill="#2b3440"/>
  </g>

  <!-- ===== DigiRig ===== -->
  <g>
    <rect x="372" y="200" width="128" height="76" rx="12" fill="#ffffff" stroke="#2b3440" stroke-width="2.5"/>
    <!-- aansluitingen links -->
    <circle cx="372" cy="238" r="7" fill="#2b3440"/>
    <!-- USB rechts -->
    <rect x="494" y="230" width="10" height="16" rx="3" fill="#2b3440"/>
    <!-- lampje + tekst -->
    <circle cx="390" cy="216" r="4" fill="#3d9b57"/>
    <text x="436" y="244" font-size="17" font-weight="700" text-anchor="middle" fill="#2b3440">DigiRig</text>
  </g>

  <!-- ===== Raspberry Pi Zero ===== -->
  <g>
    <rect x="610" y="188" width="250" height="112" rx="10" fill="#3d8b4f" stroke="#2a6338" stroke-width="2"/>
    <!-- montagegaten -->
    <g fill="#f6f8fa" stroke="#c9a74a" stroke-width="2">
      <circle cx="626" cy="204" r="6"/><circle cx="844" cy="204" r="6"/>
      <circle cx="626" cy="284" r="6"/><circle cx="844" cy="284" r="6"/>
    </g>
    <!-- GPIO-rij -->
    <g fill="#c9a74a">
      <circle cx="660" cy="200" r="3"/><circle cx="674" cy="200" r="3"/><circle cx="688" cy="200" r="3"/><circle cx="702" cy="200" r="3"/><circle cx="716" cy="200" r="3"/><circle cx="730" cy="200" r="3"/><circle cx="744" cy="200" r="3"/><circle cx="758" cy="200" r="3"/><circle cx="772" cy="200" r="3"/><circle cx="786" cy="200" r="3"/><circle cx="800" cy="200" r="3"/><circle cx="814" cy="200" r="3"/>
      <circle cx="660" cy="212" r="3"/><circle cx="674" cy="212" r="3"/><circle cx="688" cy="212" r="3"/><circle cx="702" cy="212" r="3"/><circle cx="716" cy="212" r="3"/><circle cx="730" cy="212" r="3"/><circle cx="744" cy="212" r="3"/><circle cx="758" cy="212" r="3"/><circle cx="772" cy="212" r="3"/><circle cx="786" cy="212" r="3"/><circle cx="800" cy="212" r="3"/><circle cx="814" cy="212" r="3"/>
    </g>
    <!-- processor -->
    <rect x="706" y="230" width="52" height="44" rx="4" fill="#2b3440"/>
    <!-- poorten onderkant -->
    <rect x="692" y="292" width="20" height="10" rx="2" fill="#aab4bf" stroke="#2b3440" stroke-width="1.5"/>
    <rect x="728" y="292" width="20" height="10" rx="2" fill="#aab4bf" stroke="#2b3440" stroke-width="1.5"/>
    <!-- AX25Chat-label op de print -->
    <rect x="768" y="238" width="70" height="26" rx="5" fill="#ffffff" opacity="0.92"/>
    <text x="803" y="256" font-size="12" font-weight="700" text-anchor="middle" fill="#2b3440">AX25Chat</text>
  </g>

  <!-- ===== wifi ===== -->
  <g fill="none" stroke="#2f6fb3" stroke-width="6" stroke-linecap="round">
    <path d="M908 222 A 22 22 0 0 1 908 266"/>
    <path d="M922 206 A 42 42 0 0 1 922 282"/>
    <path d="M936 190 A 62 62 0 0 1 936 298"/>
  </g>
  <circle cx="892" cy="244" r="6" fill="#2f6fb3"/>

  <!-- ===== telefoon ===== -->
  <g>
    <rect x="1000" y="120" width="120" height="226" rx="18" fill="#2b3440"/>
    <rect x="1008" y="138" width="104" height="186" rx="6" fill="#ffffff"/>
    <rect x="1042" y="127" width="36" height="5" rx="2.5" fill="#6b7685"/>
    <!-- kopbalk -->
    <rect x="1008" y="138" width="104" height="22" rx="6" fill="#2f6fb3"/>
    <rect x="1008" y="150" width="104" height="10" fill="#2f6fb3"/>
    <text x="1060" y="154" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">AX25Chat</text>
    <!-- chatballonnen -->
    <rect x="1016" y="172" width="66" height="22" rx="8" fill="#e7ecf1"/>
    <rect x="1038" y="204" width="66" height="22" rx="8" fill="#cfe0f3"/>
    <rect x="1016" y="236" width="56" height="22" rx="8" fill="#e7ecf1"/>
    <rect x="1048" y="268" width="56" height="22" rx="8" fill="#cfe0f3"/>
    <!-- invoerregel -->
    <rect x="1016" y="300" width="88" height="16" rx="8" fill="none" stroke="#aab4bf" stroke-width="1.5"/>
  </g>

  <!-- ===== kabel-labels ===== -->
  <g font-size="15" fill="#2f6fb3" font-weight="600" text-anchor="middle">
    <text x="289" y="190">audio + PTT</text>
    <text x="289" y="270" font-size="13" font-weight="400" fill="#57606a">kabel (K-stekker)</text>
    <text x="540" y="322">USB-kabel</text>
    <text x="930" y="160">wifi</text>
    <text x="930" y="330" font-size="13" font-weight="400" fill="#57606a">hotspot van de Pi</text>
  </g>

  <!-- ===== namen onder de apparaten ===== -->
  <g text-anchor="middle" fill="#24292f">
    <text x="150" y="392" font-size="19" font-weight="700">Portofoon</text>
    <text x="150" y="416" font-size="14" fill="#57606a">Baofeng UV-5R</text>

    <text x="436" y="392" font-size="19" font-weight="700">DigiRig</text>
    <text x="436" y="416" font-size="14" fill="#57606a">geluidskaart + PTT</text>

    <text x="735" y="392" font-size="19" font-weight="700">Raspberry Pi Zero 2W</text>
    <text x="735" y="416" font-size="14" fill="#57606a">AX25Chat · Direwolf · hotspot</text>

    <text x="1060" y="392" font-size="19" font-weight="700">Telefoon</text>
    <text x="1060" y="416" font-size="14" fill="#57606a">AX25Chat-app of browser</text>
  </g>
</svg>
