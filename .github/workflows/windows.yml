# Bouwt het Windows-programma: PyInstaller (AX25Chat.exe met Python, pywebview en de code), Direwolf en Hamlib
# erbij, en daarna met Inno Setup één AX25Chat-setup-<versie>.exe.
# Een nieuwe release gaat vanzelf: verhoog installatie/windows/versie.txt (bijv. 0.2); na de merge naar main maakt
# deze workflow tag win-v0.2 en de release met de installer. Anders alleen een test-installer onder Actions, Artifacts.
name: Windows-programma

on:
  push:
    branches: [main]
    paths: ["pc/**", "chat/**", "gemeenschappelijk/**", "installatie/windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["pc/**", "chat/**", "gemeenschappelijk/**", "installatie/windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versie
        run: |
          versie="$(tr -d ' \r\n' < installatie/windows/versie.txt)"
          uitgeven=nee
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] && ! git rev-parse -q --verify "refs/tags/win-v$versie" >/dev/null; then
            naam="$versie"; uitgeven=ja
            echo "Nieuwe versie $versie: release win-v$versie wordt gemaakt."
          else
            naam="$versie-test.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSIE_NAAM=$naam" >> "$GITHUB_ENV"
          echo "UITGEVEN=$uitgeven" >> "$GITHUB_ENV"
          echo "$naam ($(git log -1 --format='%h %cd' --date=format:'%Y-%m-%d'))" > versie.txt

      - name: Tests (Windows-delen)
        run: python -m unittest -v tests.test_systeem tests.test_windows tests.test_venster tests.test_pc.TestTelefoon tests.test_pc.TestFirewall

      - name: Firewallregel voor de telefoon (maken, controleren, weghalen)
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "gemeenschappelijk")
          import ax25chat_telefoon as tel
          print("opdracht:", tel.firewall_opdracht(8099))
          assert not tel.firewall_regel_er(8099), "regel bestond al"
          uit = tel.firewall_open(8099)
          print("uitkomst:", repr(uit))
          assert tel.firewall_regel_er(8099), "regel niet gemaakt"
          print(subprocess.run(["netsh", "advfirewall", "firewall", "show", "rule", "name=" + tel.firewall_regel(8099)],
                               capture_output=True, text=True).stdout)
          subprocess.run(["netsh", "advfirewall", "firewall", "delete", "rule", "name=" + tel.firewall_regel(8099)], check=True)
          PY

      - name: USB-apparaten opvragen met PowerShell (snelheid en geldige JSON)
        run: |
          python - <<'PY'
          import json, subprocess, sys, time
          sys.path.insert(0, "gemeenschappelijk")
          import ax25chat_usb as usb
          t = time.time()
          r = subprocess.run(["powershell", "-NoProfile", "-NonInteractive", "-Command", usb.PS_SCRIPT],
                             capture_output=True, text=True, timeout=120)
          print(f"{time.time() - t:.1f} s, code {r.returncode}")
          print("stderr:", r.stderr[:2000])
          data = json.loads(r.stdout or "[]")
          print(len(data), "apparaten:", json.dumps(data, indent=1)[:3000])
          PY

      - name: Python-pakketten
        run: python -m pip install --upgrade pip pyinstaller pywebview pillow

      - name: Pictogram (.ico)
        run: python -c "from PIL import Image; Image.open('pc/ax25chat.png').save('installatie/windows/ax25chat.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: AX25Chat.exe maken (PyInstaller)
        run: |
          verborgen=""
          for f in chat/ax25chat_*.py gemeenschappelijk/ax25chat_*.py pc/ax25chat_pc.py; do
            verborgen="$verborgen --hidden-import $(basename "$f" .py)"
          done
          pyinstaller --noconfirm --clean --windowed --name AX25Chat \
            --icon installatie/windows/ax25chat.ico \
            --paths chat --paths gemeenschappelijk --paths pc $verborgen \
            --collect-all webview \
            --add-data "gemeenschappelijk/leaflet;leaflet" \
            --add-data "pc/ax25chat.png;." \
            --add-data "versie.txt;." \
            pc/ax25chat_venster.py

      # Direwolf zelf bouwen, mét Hamlib: de officiële Direwolf voor Windows heeft geen Hamlib, en zonder kan
      # Direwolf de set niet via CAT laten zenden (PTT RIG). Nodig voor sets met één USB-poort, zoals de IC-7300.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-hamlib

      - name: Direwolf bouwen met Hamlib (MSYS2)
        shell: msys2 {0}
        run: |
          git clone -q --depth 1 --branch 1.8.1 https://github.com/wb2osz/direwolf.git dw-bron
          cmake -S dw-bron -B dw-bouw -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/dw-klaar"
          grep -q "USE_HAMLIB" dw-bouw/CMakeCache.txt || { echo "Hamlib niet gevonden door CMake"; exit 1; }
          cmake --build dw-bouw
          cmake --install dw-bouw
          # DLL's van MSYS2 die direwolf.exe nodig heeft ernaast zetten (libhamlib-4.dll, libusb, libwinpthread ...)
          for exe in dw-klaar/*.exe; do
            ldd "$exe" | awk '/mingw64/ {print $3}'
          done | sort -u | while read -r dll; do cp -v "$dll" dw-klaar/; done
          ls dw-klaar
          ls dw-klaar | grep -qi '^libhamlib.*\.dll$' || { echo "libhamlib ontbreekt naast direwolf.exe"; exit 1; }

      - name: Hamlib (rigctld) ophalen
        run: |
          mkdir -p ophalen/hl
          gh release download --repo Hamlib/Hamlib --pattern 'hamlib-w64-*.zip' --dir ophalen/hl
          ls -l ophalen/hl
          (cd ophalen/hl && unzip -q *.zip && rm -f *.zip)
          hl="$(dirname "$(find ophalen/hl -iname rigctld.exe | head -1)")"
          [ -f dw-klaar/direwolf.exe ] && [ -f "$hl/rigctld.exe" ] || { echo "direwolf.exe of rigctld.exe niet gevonden"; exit 1; }
          mkdir -p dist/AX25Chat/direwolf dist/AX25Chat/hamlib
          cp -r dw-klaar/. dist/AX25Chat/direwolf/
          cp "$hl"/*.exe "$hl"/*.dll dist/AX25Chat/hamlib/
          for f in COPYING COPYING.LIB LICENSE README; do
            find ophalen/hl -maxdepth 2 -name "$f*" -exec cp {} dist/AX25Chat/hamlib/ \; ; done
          ls dist/AX25Chat dist/AX25Chat/direwolf dist/AX25Chat/hamlib
          ./dist/AX25Chat/direwolf/direwolf.exe -h 2>&1 | head -5 | tee dw-h.txt || true
          grep -qi hamlib dw-h.txt || { echo "Direwolf zegt niets over Hamlib"; exit 1; }

      - name: PTT via CAT testen (Direwolf → rigctld met nep-set)
        continue-on-error: true           # de runner heeft geen geluidskaart; dit is ter informatie
        run: |
          hl=dist/AX25Chat/hamlib dw=dist/AX25Chat/direwolf
          "$hl/rigctld.exe" -m 1 -T 127.0.0.1 -t 4532 &
          sleep 2
          printf 'ADEVICE udp:7355 default\nACHANNELS 1\nCHANNEL 0\nMYCALL N0CALL\nMODEM 1200\nPTT RIG 2 127.0.0.1:4532\nKISSPORT 8001\nAGWPORT 0\n' > ptt-test.conf
          "$dw/direwolf.exe" -c ptt-test.conf -t 0 > ptt-test.log 2>&1 &
          sleep 8
          cat ptt-test.log
          ! grep -qi "Hamlib.*error\|not available\|not included" ptt-test.log
          taskkill //F //IM direwolf.exe || true
          taskkill //F //IM rigctld.exe || true

      - name: Zelftest van AX25Chat.exe (zonder venster)
        run: |
          export AX25CHAT_ZELFTEST="$RUNNER_TEMP/zelftest.txt" AX25CHAT_MAP="$RUNNER_TEMP/ax25chat-map"
          ./dist/AX25Chat/AX25Chat.exe --poort 8099 &
          for i in $(seq 1 60); do [ -s "$AX25CHAT_ZELFTEST" ] && break; sleep 2; done
          cat "$AX25CHAT_ZELFTEST" || { echo "geen uitslag; logboek:"; cat "$AX25CHAT_MAP/logboek/ax25chat.log"; exit 1; }
          ! grep -q FOUT "$AX25CHAT_ZELFTEST"

      - name: Venstertest van AX25Chat.exe (echt venster met WebView2)
        run: |
          export AX25CHAT_VENSTERTEST="$RUNNER_TEMP/venstertest.txt" AX25CHAT_MAP="$RUNNER_TEMP/ax25chat-venster"
          ./dist/AX25Chat/AX25Chat.exe &
          for i in $(seq 1 60); do [ -s "$AX25CHAT_VENSTERTEST" ] && break; sleep 2; done
          echo "--- logboek ---"; cat "$AX25CHAT_MAP/logboek/ax25chat.log" || true
          echo "--- uitslag ---"; cat "$AX25CHAT_VENSTERTEST" || { echo "geen uitslag"; exit 1; }
          ! grep -q FOUT "$AX25CHAT_VENSTERTEST"

      - name: Installer maken (Inno Setup)
        env:
          MSYS2_ARG_CONV_EXCL: "*"            # Git Bash mag /DVersie=... niet in een pad veranderen
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" "/DVersie=$VERSIE_NAAM" installatie/windows/ax25chat.iss
          ls -l uitvoer

      - uses: actions/upload-artifact@v4
        with:
          name: AX25Chat-setup-${{ env.VERSIE_NAAM }}
          path: uitvoer/*.exe

      - name: Release maken
        if: env.UITGEVEN == 'ja'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ env.VERSIE_NAAM }}
          target_commitish: ${{ github.sha }}
          name: AX25Chat voor Windows ${{ env.VERSIE_NAAM }}
          files: uitvoer/*.exe
          body: |
            AX25Chat voor Windows (testfase). Download AX25Chat-setup-${{ env.VERSIE_NAAM }}.exe en start het.
            Windows kan waarschuwen dat de uitgever onbekend is: kies "Meer informatie" en "Toch uitvoeren".
            Direwolf (gebouwd met Hamlib, dus zenden via CAT) en Hamlib (rigctld) zitten erin. Uitleg: docs/PROCEDURE.md, deel "AX25Chat op Windows".
