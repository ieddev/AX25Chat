# Bouwt de Android-app (map android/). Een nieuwe release gaat vanzelf: verhoog het versienummer in
# android/versie.txt (bijv. 0.3); na de merge naar main maakt deze workflow tag app-v0.3 en de release met de APK.
# Een tag app-v... met de hand maken (Releases op GitHub) werkt ook nog.
# Ondertekenen: secrets AX25CHAT_KEYSTORE_B64 en AX25CHAT_KEYSTORE_WACHTWOORD (zie docs/PROCEDURE.md, Android-app).
name: Android-app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["app-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # ook de tags: bestaat de release voor deze versie al?

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sleutel klaarzetten
        env:
          SLEUTEL: ${{ secrets.AX25CHAT_KEYSTORE_B64 }}
        run: |
          if [ -n "$SLEUTEL" ]; then
            echo "$SLEUTEL" | base64 -d > "$RUNNER_TEMP/ax25chat.jks"
            echo "AX25CHAT_KEYSTORE=$RUNNER_TEMP/ax25chat.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Geen sleutel in de secrets: de APK is met een tijdelijke sleutel ondertekend (alleen om te testen)."
          fi

      - name: Versie
        run: |
          versie="$(tr -d ' \r\n' < android/versie.txt)"
          uitgeven=nee
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            naam="${GITHUB_REF#refs/tags/app-v}"; uitgeven=ja
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] && ! git rev-parse -q --verify "refs/tags/app-v$versie" >/dev/null; then
            naam="$versie"; uitgeven=ja              # nieuw versienummer op main: zelf de release maken
            echo "Nieuwe versie $versie: release app-v$versie wordt gemaakt."
          else
            naam="$versie-test.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSIE_NAAM=$naam" >> "$GITHUB_ENV"
          echo "VERSIE_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "UITGEVEN=$uitgeven" >> "$GITHUB_ENV"

      - name: APK bouwen
        working-directory: android
        env:
          AX25CHAT_KEYSTORE_WACHTWOORD: ${{ secrets.AX25CHAT_KEYSTORE_WACHTWOORD }}
        run: gradle --no-daemon assembleRelease

      - name: APK hernoemen
        run: cp android/app/build/outputs/apk/release/app-release.apk "AX25Chat-${VERSIE_NAAM}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AX25Chat-${{ env.VERSIE_NAAM }}
          path: AX25Chat-*.apk

      - name: Release maken
        if: env.UITGEVEN == 'ja'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.VERSIE_NAAM }}
          target_commitish: ${{ github.sha }}
          name: AX25Chat-app ${{ env.VERSIE_NAAM }}
          files: AX25Chat-*.apk
          body: |
            Android-app van AX25Chat. Installeren: download het APK-bestand op je telefoon en open het.
            Uitleg (ook over "onbekende bronnen"): docs/PROCEDURE.md, hoofdstuk Android-app.
