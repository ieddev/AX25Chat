name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # zoals Raspberry Pi OS Bookworm
      - run: python -m unittest discover -s tests -v

  # Op weg naar AX25Chat op een Windows-PC: kunnen alle onderdelen al geladen worden?
  # Mag voorlopig mislukken; dat laat zien wat er nog te doen is.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      AX25CHAT_MAP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p test_systeem.py -v
      - name: Onderdelen laden
        run: |
          cd chat
          python -c "import sys; sys.path.insert(0, '../gemeenschappelijk'); import ax25chat_web, ax25chat_baken, ax25chat_bbs; print('alles geladen')"
